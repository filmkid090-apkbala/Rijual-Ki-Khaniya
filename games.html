<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<meta name="description" content="Rijual Ki Khaniya — कहानियों वाले गेम">
<title>Games - Rijual Ki Khaniya</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{--purple:#6d4aff;--ink:#24213b;--muted:#716e85;--cream:#fffaf0;--pink:#ffdfeb;--yellow:#ffe58b}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,#6d4aff,#a06bff);color:#fff;padding:22px 18px 24px;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:900}.tag{font-size:12px;opacity:.9}
.hero{margin-top:18px;font-size:24px;font-weight:850;line-height:1.35}.hero small{display:block;font-size:14px;font-weight:500;margin-top:6px;opacity:.95}
main{max-width:820px;margin:auto;padding:16px 14px 40px}
button,a.pill{font:inherit;border:0;cursor:pointer;text-decoration:none}
button:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:10px 14px;border-radius:999px;background:#fff;color:var(--purple);font-weight:750;box-shadow:0 3px 12px #2c1a4d0c}
.primary{background:var(--purple);color:#fff;padding:12px 16px;border-radius:14px;font-weight:800}
.secondary{background:#f0ecff;color:var(--purple);padding:11px 13px;border-radius:12px;font-weight:750}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gamecard,.storycard{border:1px solid #eee7ff;background:#fff;border-radius:20px;padding:16px;text-align:left;box-shadow:0 5px 18px #2c1a4d08;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-height:150px}
.gamecard .big{font-size:44px}.gamecard strong,.storycard strong{font-size:16px;line-height:1.4}.gamecard small,.storycard small{color:var(--muted);line-height:1.5}
.storycard .thumb{width:100%;height:90px;object-fit:cover;border-radius:12px;background:#f0ecff}
.storycard .emoji{font-size:40px;height:90px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--yellow));border-radius:12px}
.panel{background:#fff;border:1px solid #eee7ff;border-radius:22px;padding:16px;box-shadow:0 5px 18px #2c1a4d08}
h2.sec{font-size:19px;margin:6px 2px 12px}
.notice{background:#fff4c8;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.6;margin:12px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.stat{background:#f0ecff;color:var(--purple);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.seg button{background:#f0ecff;color:var(--purple);padding:9px 13px;font-weight:750;border-radius:12px}
.seg button.on{background:var(--purple);color:#fff}
.stage{position:relative;margin:10px auto;max-width:580px}
canvas{display:block;max-width:100%;touch-action:none;border-radius:18px}
.overlay{position:absolute;inset:0;background:#24213bcc;color:#fff;border-radius:18px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:16px;z-index:5}
.overlay h2{margin:0;font-size:26px}.overlay p{margin:0}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center;margin:12px auto}
.dpad button{background:var(--purple);color:#fff;border-radius:16px;font-size:24px;font-weight:900;touch-action:manipulation}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.mem{display:grid;gap:10px;margin:12px auto;max-width:560px}
.card{perspective:700px;background:none;padding:0;aspect-ratio:1/1;min-height:64px}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.flip .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 4px 14px #2c1a4d14}
.card .b{background:linear-gradient(135deg,#6d4aff,#a06bff);color:#fff;font-size:28px}
.card .f{background:#fff;border:3px solid #eee7ff;transform:rotateY(180deg);font-size:34px;text-align:center;padding:4px;font-weight:800;line-height:1.2}
.card .f.word{font-size:clamp(13px,3.6vw,20px)}.card .f img{width:100%;height:100%;object-fit:cover}
.card.done .f{border-color:#23985b;background:#e7f8ee}
.palette{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9d0f7;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--purple)}
.colorwrap{background:#fff;border:2px dashed #d9d0f7;border-radius:18px;padding:6px;text-align:center}
.colorwrap canvas{margin:auto;border-radius:12px;cursor:crosshair;background:#fff}
label.inl{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
input[type=range]{accent-color:var(--purple)}
@media(max-width:420px){.dpad{grid-template-columns:repeat(3,72px)}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 10px}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="brand">🎮 Rijual Ki Khaniya · Games</div><div class="tag">खेलो, सीखो और मज़े करो</div></div>
    <a class="pill" href="./index.html">📚 सभी कहानियाँ</a>
  </div>
  <div class="hero">कहानी चुनो, खेल खेलो!<small>हर नई कहानी यहाँ अपने-आप आ जाती है ✨</small></div>
</header>
<main>
  <div class="crumbs" id="crumbs"></div>
  <div id="status" class="notice hidden"></div>

  <section id="hub" class="hidden">
    <h2 class="sec">कौन-सा गेम खेलें?</h2>
    <div class="grid">
      <button class="gamecard" data-game="maze"><span class="big">🧩</span><strong>Maze Game</strong><small>रास्ता ढूँढो, ⭐ इकट्ठे करो और Exit तक पहुँचो।</small></button>
      <button class="gamecard" data-game="color"><span class="big">🎨</span><strong>Rang Bharo</strong><small>कहानी की तस्वीर में अपने पसंद के रंग भरो।</small></button>
      <button class="gamecard" data-game="memory"><span class="big">🃏</span><strong>Memory Card Game</strong><small>कार्ड पलटो और एक जैसी जोड़ियाँ मिलाओ।</small></button>
    </div>
  </section>

  <section id="picker" class="hidden">
    <h2 class="sec" id="pickerTitle"></h2>
    <div class="grid" id="storyGrid"></div>
  </section>

  <section id="play" class="hidden panel"></section>
</main>
<footer>Rijual Ki Khaniya · कहानियाँ पढ़ें, सुनें और खेलें</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="./config.js"></script>
<script src="./games.js"></script>
</body>
</html>
